<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIGI Day 2026 Poster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@700;800&family=Poppins:wght@700;800&display=swap');
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:#1a1030;
    font-family:'Poppins','Anek Malayalam',sans-serif;
    background:
      radial-gradient(circle at 10% 0%, rgba(180,40,180,.16), transparent 36%),
      radial-gradient(circle at 100% 8%, rgba(40,80,220,.12), transparent 40%),
      #f4eef8;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 12px 48px;
  }
  .bar{width:100%; max-width:460px; height:6px; border-radius:4px; margin-bottom:12px;
    background:linear-gradient(90deg,#c2185b,#7b1fa2 50%,#1976d2);}
  h1{font-size:18px; font-weight:800; margin:0 0 4px; text-align:center; color:#6a1b9a; font-family:'Anek Malayalam',sans-serif;}
  p.sub{margin:0 0 12px; text-align:center; color:#6d5a7a; font-size:13px;}
  .stage{width:100%; max-width:420px; border-radius:16px; overflow:hidden;
    box-shadow:0 16px 36px rgba(40,10,60,.22); background:#fff;}
  .stage canvas{display:block; width:100%; height:auto;}
  .cards{width:100%; max-width:480px; margin-top:14px; display:flex; flex-direction:column; gap:12px;}
  .card{background:#fff; border-radius:16px; padding:14px 16px; border:1px solid #eadff0;
    box-shadow:0 8px 18px rgba(40,10,60,.05); position:relative; overflow:hidden;}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,#c2185b,#7b1fa2);}
  .card-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .num{width:24px; height:24px; border-radius:50%; color:#fff; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; background:#7b1fa2;}
  .ttl{font-size:14.5px; font-weight:800; color:#6a1b9a; font-family:'Anek Malayalam',sans-serif;}
  label{display:block; font-size:12px; color:#6d5a7a; font-weight:700; margin-bottom:6px;}
  input[type="text"]{
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid #eadff0; background:#fdfaff;
    font-family:'Anek Malayalam','Poppins',sans-serif; font-weight:700; font-size:15px; outline:none; color:#1a1030;
  }
  input:focus{border-color:#7b1fa2;}
  .size-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .size-row input{flex:1; accent-color:#7b1fa2;}
  .size-val{min-width:42px; text-align:right; font-weight:800; color:#6a1b9a; font-size:13px;}
  .btn{width:100%; padding:12px; border:none; border-radius:10px; font-weight:800; cursor:pointer; font-family:'Anek Malayalam',sans-serif;}
  .btn-photo{background:linear-gradient(135deg,#7b1fa2,#c2185b); color:#fff;}
  .btn-recrop{background:#f6eef8; color:#6a1b9a; border:1.5px solid #e0c8ec; margin-top:8px;}
  .btn-reset{background:#fff; color:#8a3a3a; border:1.5px solid #f0c7c7; margin-top:8px;}
  .btn-recrop:disabled,.btn-reset:disabled{opacity:.4; cursor:not-allowed;}
  .photo-row{display:flex; gap:10px; align-items:center;}
  .thumb{width:64px; height:84px; border-radius:10px; border:2px dashed #d8c0e4; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:#faf6fc; flex-shrink:0;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .hint{font-size:11.5px; color:#7a6888; margin-top:8px; line-height:1.45;}
  .btn-download{background:linear-gradient(135deg,#6a1b9a,#3a0d5c); color:#fff; font-size:15.5px; padding:15px;}
  #filePhoto{display:none;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(16,8,28,.86); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal-card{background:#fff; border-radius:18px; padding:20px; width:100%; max-width:440px; text-align:center;}
  .modal-card h2{margin:0 0 6px; color:#6a1b9a; font-size:16px; font-family:'Anek Malayalam',sans-serif;}
  .crop-wrap{margin:0 auto 12px; border-radius:8px; overflow:hidden; background:#f4efe8; touch-action:none; cursor:grab;}
  .crop-wrap canvas{display:block; width:100%; height:auto;}
  .zoom-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .zoom-row input{flex:1; accent-color:#7b1fa2;}
  .modal-actions{display:flex; gap:10px;}
  .btn-cancel{background:#f4eee6; color:#5a4630;}
</style>
</head>
<body>
  <div class="bar"></div>
  <h1>CIGI Day 2026</h1>
  <p class="sub">ഫോട്ടോയും പേരും ചേർത്ത് പോസ്റ്റർ തയ്യാറാക്കൂ</p>
  <div class="stage"><canvas id="posterCanvas" width="1978" height="2560"></canvas></div>
  <div class="cards">
    <div class="card">
      <div class="card-head"><span class="num">1</span><span class="ttl">ഫോട്ടോ</span></div>
      <div class="photo-row">
        <div class="thumb" id="photoThumb">📷</div>
        <div style="flex:1">
          <button class="btn btn-photo" id="pickPhotoBtn">ഫോട്ടോ അപ്‌ലോഡ്</button>
          <button class="btn btn-recrop" id="recropPhotoBtn" disabled>✂️ ക്രോപ്പ്</button>
          <button class="btn btn-reset" id="resetPhotoBtn" disabled>↺ റീസെറ്റ്</button>
        </div>
      </div>
      <p class="hint">ഫ്രെയിമിന്റെ നാല് വശവും മറയും.</p>
    </div>
    <div class="card">
      <div class="card-head"><span class="num">2</span><span class="ttl">പേര്</span></div>
      <label for="nameInput">മലയാളം / English CAPITAL</label>
      <input type="text" id="nameInput" maxlength="36" placeholder="പേര്" autocomplete="off">
      <div class="size-row">
        <span style="font-size:12px;color:#6d5a7a;font-weight:700">സൈസ്</span>
        <input type="range" id="nameSize" min="28" max="90" value="42">
        <span class="size-val" id="nameSizeVal">42</span>
      </div>
    </div>
    <button class="btn btn-download" id="downloadBtn">⬇ പോസ്റ്റർ ഡൗൺലോഡ്</button>
    <input type="file" id="filePhoto" accept="image/*">
  </div>
  <div class="modal-backdrop" id="cropModal">
    <div class="modal-card">
      <h2>ഫോട്ടോ ക്രോപ്പ് ചെയ്യുക</h2>
      <p style="color:#6d5a7a;font-size:12px;margin:0 0 12px">വലിച്ചു നീക്കാം, സൂം ചെയ്യാം. നാല് വശവും നിറയും.</p>
      <div class="crop-wrap" id="cropWrap"><canvas id="cropCanvas"></canvas></div>
      <div class="zoom-row"><span>➖</span><input type="range" id="zoomRange" min="100" max="350" value="100"><span>➕</span></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="cropCancelBtn">റദ്ദാക്കുക</button>
        <button class="btn btn-photo" id="cropConfirmBtn">✔ ശരി</button>
      </div>
    </div>
  </div>

  const PHOTO={ cx:489*S, cy:888*S, w:270*S, h:360*S, radius:2 };
  const NAME={ x:489*S, y:1132*S, maxW:520*S };

  let photoPlacement=null;

  function roundRectPath(c,x,y,w,h,r){
    const rr=Math.min(r,w/2,h/2);
    c.beginPath(); c.moveTo(x+rr,y);
    c.arcTo(x+w,y,x+w,y+h,rr); c.arcTo(x+w,y+h,x,y+h,rr);
    c.arcTo(x,y+h,x,y,rr); c.arcTo(x,y,x+w,y,rr); c.closePath();
  }
  function val(id){ return (document.getElementById(id).value||'').trim(); }
  function fitText(c,text,maxW,start,font){
    let s=start;
    c.font='800 '+s+'px '+font;
    while(c.measureText(text).width>maxW && s>20){ s-=1; c.font='800 '+s+'px '+font; }
    return s;
  }
  function draw(){
    ctx.clearRect(0,0,CW,CH);
    if(templateImg.complete && templateImg.naturalWidth)
      ctx.drawImage(templateImg,0,0,CW,CH);
    else { ctx.fillStyle='#1a1030'; ctx.fillRect(0,0,CW,CH); }

    if(photoPlacement){
      ctx.save();
      roundRectPath(ctx, PHOTO.cx-PHOTO.w/2, PHOTO.cy-PHOTO.h/2, PHOTO.w, PHOTO.h, PHOTO.radius);
      ctx.clip();
      ctx.drawImage(
        photoPlacement.img,
        PHOTO.cx+photoPlacement.x-photoPlacement.w*0.025,
        PHOTO.cy+photoPlacement.y-photoPlacement.h*0.025,
        photoPlacement.w*1.05,
        photoPlacement.h*1.05
      );
      ctx.restore();
    }

    const name=val('nameInput');
    if(name){
      const size=parseInt(document.getElementById('nameSize').value,10)*S;
      ctx.save();
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#ffffff';
      ctx.shadowColor='rgba(0,0,0,.55)';
      ctx.shadowBlur=10*S;
      ctx.shadowOffsetY=2*S;
      fitText(ctx, name, NAME.maxW, size, '"Anek Malayalam","Poppins",sans-serif');
      ctx.fillText(name, NAME.x, NAME.y);
      ctx.restore();
    }
  }

  templateImg.onload=draw;
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  document.getElementById('nameInput').addEventListener('input', e=>{
    const el=e.target;
    el.value=el.value.replace(/[a-z]/g, c=>c.toUpperCase());
    draw();
  });
  document.getElementById('nameSize').addEventListener('input', e=>{
    document.getElementById('nameSizeVal').textContent=e.target.value;
    draw();
  });

  const cropModal=document.getElementById('cropModal');
  const cropCanvas=document.getElementById('cropCanvas');
  const cropCtx=cropCanvas.getContext('2d');
  const cropWrap=document.getElementById('cropWrap');
  const zoomRange=document.getElementById('zoomRange');
  let pendingImg=null, baseScale=1, zoom=1, panX=0, panY=0;
  let dragging=false, dsx=0, dsy=0, psx=0, psy=0;
  let PW=280, PH=372;

  function cur(){
    const sc=baseScale*zoom, w=pendingImg.width*sc, h=pendingImg.height*sc;
    return {x:PW/2-w/2+panX, y:PH/2-h/2+panY, w, h};
  }
  function clamp(){
    const sc=baseScale*zoom, w=pendingImg.width*sc, h=pendingImg.height*sc;
    const mx=Math.max(0,(w-PW)/2), my=Math.max(0,(h-PH)/2);
    panX=Math.min(mx,Math.max(-mx,panX)); panY=Math.min(my,Math.max(-my,panY));
  }
  function drawCrop(){
    cropCtx.clearRect(0,0,PW,PH);
    cropCtx.save();
    cropCtx.beginPath(); cropCtx.rect(0,0,PW,PH); cropCtx.clip();
    cropCtx.fillStyle='#f4efe8'; cropCtx.fillRect(0,0,PW,PH);
    if(pendingImg){ const d=cur(); cropCtx.drawImage(pendingImg,d.x,d.y,d.w,d.h); }
    cropCtx.restore();
  }
  function openCrop(img){
    pendingImg=img;
    PW=280; PH=Math.round(280*(PHOTO.h/PHOTO.w));
    cropCanvas.width=PW; cropCanvas.height=PH;
    baseScale=Math.max(PW/img.width, PH/img.height);
    zoom=1; panX=0; panY=0; zoomRange.value=100;
    drawCrop(); cropModal.classList.add('open');
  }
  cropWrap.addEventListener('pointerdown', e=>{
    if(!pendingImg) return;
    dragging=true; cropWrap.setPointerCapture(e.pointerId);
    dsx=e.clientX; dsy=e.clientY; psx=panX; psy=panY;
  });
  cropWrap.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const rect=cropCanvas.getBoundingClientRect();
    panX=psx+(e.clientX-dsx)*(PW/rect.width);
    panY=psy+(e.clientY-dsy)*(PH/rect.height);
    clamp(); drawCrop();
  });
  cropWrap.addEventListener('pointerup', ()=>dragging=false);
  cropWrap.addEventListener('pointercancel', ()=>dragging=false);
  zoomRange.addEventListener('input', ()=>{ zoom=parseInt(zoomRange.value,10)/100; clamp(); drawCrop(); });
  document.getElementById('cropCancelBtn').onclick=()=>cropModal.classList.remove('open');
  document.getElementById('cropConfirmBtn').onclick=()=>{
    const d=cur(); const mapX=PHOTO.w/PW, mapY=PHOTO.h/PH;
    photoPlacement={ img:pendingImg, x:(d.x-PW/2)*mapX, y:(d.y-PH/2)*mapY, w:d.w*mapX, h:d.h*mapY };
    document.getElementById('recropPhotoBtn').disabled=false;
    document.getElementById('resetPhotoBtn').disabled=false;
    const thumb=document.getElementById('photoThumb'); thumb.innerHTML='';
    const im=document.createElement('img'); im.src=pendingImg.src; thumb.appendChild(im);
    cropModal.classList.remove('open'); draw();
  };
  const filePhoto=document.getElementById('filePhoto');
  document.getElementById('pickPhotoBtn').onclick=()=>filePhoto.click();
  filePhoto.addEventListener('change', e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=ev=>{ const img=new Image(); img.onload=()=>openCrop(img); img.src=ev.target.result; };
    r.readAsDataURL(file); filePhoto.value='';
  });
  document.getElementById('recropPhotoBtn').onclick=()=>{ if(photoPlacement) openCrop(photoPlacement.img); };
  document.getElementById('resetPhotoBtn').onclick=()=>{
    photoPlacement=null; document.getElementById('photoThumb').innerHTML='📷';
    document.getElementById('recropPhotoBtn').disabled=true;
    document.getElementById('resetPhotoBtn').disabled=true; draw();
  };
  document.getElementById('downloadBtn').onclick=()=>{
    draw();
    const nm=(val('nameInput')||'poster').replace(/\s+/g,'_');
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='cigi-'+nm+'.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    },'image/jpeg',0.92);
  };
})();
</script>
